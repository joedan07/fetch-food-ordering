<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Report figures</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; background: #fff; color: #14110e; }
  .fig { display: none; width: 1200px; padding: 28px 30px; }

  svg { display: block; }
  text { font-family: "Helvetica Neue", Arial, sans-serif; fill: #14110e; }
  .ttl { font-size: 15px; font-weight: 700; }

  .arrow-em { stroke: #d4480f; stroke-width: 1.6; fill: none; marker-end: url(#ae); }
  .dash { stroke-dasharray: 5 4; }
  .bar { fill: #d4480f; } .bar2 { fill: #8c8276; } .bar3 { fill: #1d7a53; }
  .grid { stroke: #e2d9cc; stroke-width: 1; }
  .cap { font-size: 12px; fill: #6b6256; margin-top: 10px; display: block; }

</head>
<body>

  <text class="sm" x="462" y="292" font-weight="700">lib/eta.php — honest ETA engine</text>
  <text class="sm" x="462" y="310">queue wait + cook time + ride time</text>
  <rect class="box-soft" x="450" y="340" width="294" height="60" rx="5"/>
  <text class="sm" x="462" y="360" font-weight="700">Cross-cutting</text>

  <path class="arrow-em" d="M766,150 H 844"/>

  <rect class="box-soft" x="846" y="276" width="274" height="90" rx="6"/>
  <text class="lbl" x="862" y="300">File storage</text>
  <text class="sm" x="862" y="322">uploads/ — dish photographs</text>
  <text class="sm" x="862" y="340">sql/menu.xsd — schema for imports</text>

  <path class="arrow dash" d="M983,276 V 262"/>

  <text class="sm" x="20" y="494">Live updates are obtained by periodic AJAX polling (3–6 s) rather than server push, keeping the stack within PHP and Apache.</text>
</svg>
</section>

<section class="fig" id="eta">
<svg width="1140" height="520" viewBox="0 0 1140 520">
  <defs><marker id="a6" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#14110e"/></marker></defs>
  <style>.ar6 { stroke:#14110e; stroke-width:1.4; fill:none; marker-end:url(#a6); }</style>

  <!-- inputs -->
  <rect class="box" x="20" y="60" width="210" height="62" rx="6"/><text class="sm" x="34" y="84">Active orders in this kitchen</text><text class="mono" x="34" y="104">status ∈ {placed, accepted,</text><text class="mono" x="34" y="118">preparing}</text>
  <rect class="box" x="20" y="150" width="210" height="62" rx="6"/><text class="sm" x="34" y="174">Per-dish prep time</text><text class="mono" x="34" y="194">menu_items.prep_minutes</text><text class="sm" x="34" y="208">(3–25 min in the demo menu)</text>
  <rect class="box" x="20" y="240" width="210" height="62" rx="6"/><text class="sm" x="34" y="264">Kitchen capacity</text><text class="mono" x="34" y="284">max_parallel_orders</text><text class="mono" x="34" y="298">prep_buffer_min</text>
  <rect class="box" x="20" y="330" width="210" height="62" rx="6"/><text class="sm" x="34" y="354">Basket being priced</text><text class="sm" x="34" y="374">dishes and quantities</text><text class="sm" x="34" y="390">currently in the cart</text>

  <!-- stage 1 -->
  <rect class="box-soft" x="300" y="60" width="240" height="110" rx="6"/>
  <text class="sm" x="314" y="84" font-weight="700">Step 1 — work on the stoves</text>
  <text class="mono" x="314" y="106">W = Σ cook_minutes</text>
  <text class="sm" x="314" y="126">minus elapsed time for orders</text>
  <text class="sm" x="314" y="142">already being prepared</text>
  <text class="sm" x="314" y="162">(remaining work, not total work)</text>

  <rect class="box-soft" x="300" y="200" width="240" height="92" rx="6"/>
  <text class="sm" x="314" y="224" font-weight="700">Step 2 — queue wait</text>
  <text class="mono" x="314" y="248">Q = ⌈ W / capacity ⌉</text>
  <text class="sm" x="314" y="270">load% = min(100, W / (cap × 20))</text>
  <text class="sm" x="314" y="286">drives the live busy meter</text>

  <rect class="box-soft" x="300" y="322" width="240" height="92" rx="6"/>
  <text class="sm" x="314" y="346" font-weight="700">Step 3 — cook time</text>
  <text class="mono" x="314" y="370">C = max(prep) + Σ 0.15·prep·qty</text>
  <text class="sm" x="314" y="392">slowest dish dominates; extra</text>
  <text class="sm" x="314" y="408">plates add a capped surcharge</text>

  <text class="sm" x="626" y="178" font-weight="700">Quoted delivery time</text>
  <text class="mono" x="626" y="206">ETA = Q + C + buffer + ride</text>
  <text class="sm" x="626" y="232">shown before the customer</text>
  <text class="sm" x="626" y="250">commits, broken into its parts</text>
  <text class="sm" x="626" y="276">ride = 10 min (configurable)</text>

  <rect class="box" x="610" y="330" width="250" height="110" rx="6"/>
  <text class="sm" x="626" y="356" font-weight="700">Stored with the order</text>
  <text class="mono" x="626" y="380">promised_min, promised_at</text>
  <text class="mono" x="626" y="398">queue_wait_min, load_pct</text>
